services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: meetup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - meetup_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetup -d meetup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meetup_postgres_data:
